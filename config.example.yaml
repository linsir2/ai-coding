# AI-Coding example configuration.
#
# Do **not** copy this file to config.local.yaml to hold your key: a file found
# in the workspace is the *project* layer, and a project may not grant endpoints
# or credentials (a repository must not decide where your code goes).  Models,
# their base_url / api_key / provider, ai.websearch_api_key, tracing.dir and
# memory.embeddings.cache_path are dropped when they come from there.
#
# Instead:
#     ai-coding config init      # writes ~/.config/ai-coding/config.yaml (0600)
#     export DEEPSEEK_API_KEY=sk-...
#     ai-coding
#
# Keys follow snake_case; camelCase legacy keys are also accepted at load time.
# `streaming` is accepted for compatibility but has no consumer yet.

# The user layer (~/.config/ai-coding/config.yaml) is the only place this block
# belongs:
#
# models:
#   deepseek-chat:
#     provider: deepseek            # fills base_url from ai_coding/providers.py
#     name: deepseek-chat
#     api_key: ${DEEPSEEK_API_KEY}  # or omit it: the provider's env var is used
#     max_tokens: 4096
#     temperature: 0.7
#
# default_model: deepseek-chat
#
# `api_key` resolves in this order: a ${VAR} reference, then a literal you wrote,
# then the provider's conventional variable (DEEPSEEK_API_KEY / OPENAI_API_KEY /
# DASHSCOPE_API_KEY).  The environment fills an absence; it never overrules a
# literal.  A ${VAR} that is missing or empty is an error naming the variable.

ai:
  auto_process_tool_results: true
  max_tool_iterations: 10
  # B1/B2: consecutive look-only calls (read/grep/glob ... with no write/edit/bash
  # in between) before the `[search-gate]` ladder speaks.  0 disables it.
  search_streak_threshold: 4
  # I1/R-7: hard stop.  This many consecutive look-only calls (no write/edit/bash
  # in between) ends the turn and asks the model for a closing word.  0 disables.
  search_streak_l3: 16
  # B1: what the harness runs itself when the ladder reaches its second rung.
  # OFF unless you opt in: export AI_CODING_STATIC_CHECK=1.  That is deliberate --
  # this field can be set by a repository's tracked config.example.yaml, and a repo
  # must not be able to grant itself the right to run code; an env var is a channel
  # it cannot touch.  Without the opt-in the [search-gate] text still names the
  # commands, and the model can run them through bash (which has the permission
  # gate) instead.
  #
  # Each entry is an *argv*, not a shell string: it is shlex-split and executed
  # without a shell, so `;`/`&&`/`|`/`$(...)`/`>`/globs/`$VAR` are plain arguments
  # and NOT expanded.  The first word must be one of ruff/mypy/pyright/flake8/
  # black/isort/tsc/gofmt/staticcheck/shellcheck; anything else is skipped.
  # Declared, never inferred: on this repository `mypy .` reports 271 errors
  # (`scripts/` is not excluded) while `mypy ai_coding` -- what CI runs -- reports
  # none, so a project that wants mypy must say so.  Empty list disables it.
  static_check:
    # For this repository, use: ["ruff check .", "mypy ai_coding"]
    commands: ["ruff check ."]
    timeout_seconds: 20.0
    max_chars: 2000
  max_concurrent_subagents: 3
  subagent_worktree_isolation: true
  max_context_tokens: 48000
  max_messages: 50
  snip_keep_head: 3
  snip_keep_tail: 20
  keep_recent_tool_results: 3
  per_result_persist_bytes: 30000
  l4_tail_tokens: 15000
  # false stops the proactive (budget-driven) compaction; /compact and the
  # overflow rescue still work (OpenCode settings.auto parity).
  auto_compact: true
  # E-5: per-skill policy for the model's skill tool. deny hides the skill
  # from the model's catalog and withholds @mention injection too; ask sends
  # the model's own reads through the approval panel. Example:
  # skill_permissions:
  #   some-imported-skill: ask
  skill_permissions: {}
  # r17/T3: web search (Tavily).  Empty = the tool explains how to configure it.
  websearch_api_key: ""
  websearch_max_results: 5
  # R1a orchestration (see docs/r1-analysis.md)
  stop_policy: todo_aware          # natural | todo_aware | strict
  max_todo_nudges: 2
  task_injection: message          # message | system
  max_concurrent_tools: 4
  subagent_timeout_seconds: 600
  # R2: wall-clock ceiling for one user turn (0 disables it).  Iteration counts
  # cannot bound a call that never returns; on expiry the turn ends as TIMEOUT
  # with whatever text was produced.  Includes time spent on approval prompts.
  turn_timeout_seconds: 600
  # Wall clock one *plan item* may spend, shared by every turn the runner spends
  # on it (a repair pass used to buy a fresh turn timeout each time).  0 = keep
  # the per-turn ceiling above.
  plan_item_wall_seconds: 3600
  max_result_data_bytes: 8000
  max_subagent_conclusion_chars: 4000
  stream_usage: true               # set false if your endpoint rejects stream_options

memory:
  enabled: true
  auto_extract: true
  consolidate_threshold: 10
  max_index_entries: 200
  max_per_turn_injections: 5
  # R11a — the write-side gate.  The master switch and the per-channel split are
  # two orthogonal things: `extraction_enabled: false` stops every write (recall
  # keeps working, i.e. a read-only memory), while `extraction_extractors` picks
  # which channel runs — "harvest" (turn-end reconciliation) and/or
  # "memory_write" (the model's own tool).  Missing or malformed settings are
  # PERMISSIVE on purpose: a partial yaml must never silently stop writes.
  # extraction_enabled: true
  # extraction_extractors: [harvest, memory_write]   # null = all
  # R11b — wall-clock budget for one recall (filtering + semantic tier + ranking
  # + the miss probe).  Over budget the hits still come back; only the optional
  # `touch` write is skipped and one Degraded(memory_recall) is emitted.  2.0s is
  # far above the measured ~5ms, so it is a placeholder for the day the semantic
  # tier gets slow; 0 disables it.
  # recall_timeout_seconds: 2.0
  # R11d — how the lexical and semantic opinions become one rank term, for the
  # optional embeddings tier only.  blend is the default *and* the measured
  # better one: with `rrf`, reachable R@3 falls 1.00 -> 0.93 (under the 0.95
  # guardrail) to buy +1/46 paraphrase hit.  Re-measure before switching.
  # recall_fusion: blend
  # 可选语义档（R10d）：默认整块关掉。打开需要 provider 指向 models 里的一项，
  # 复用它的 base_url / api_key。deepseek 系端点没有 /embeddings（404），开了
  # 等于没开；min_cosine 是在 text-embedding-v4 上量的，换模型必须重标。
  #embeddings:
  #  enabled: true
  #  provider: "qwen"
  #  model: text-embedding-v4
  #  dimensions: 1024
  #  min_cosine: 0.60
  #  cache_path: .memory/embeddings.json
  #  timeout_seconds: 10

tools:
  bash:
    enabled: true
    timeout_seconds: 60
  read:
    enabled: true
    max_file_size: 10485760
  write:
    enabled: true
  edit:
    enabled: true
  glob:
    enabled: true
  # Directories the file tools may touch without asking, beyond the workspace
  # itself.  A standing answer, so it belongs here rather than in the grant
  # store: declare a tree once and every session reads it.  Patterns are
  # expanded at startup; empty = the workspace only.
  #
  # A path that is NOT listed is not refused either -- it asks you, once, and
  # "always" remembers that directory (opencode's external-directory ask).
  #
  # N-4b: this is an *operator* grant.  A project layer may only narrow it (it
  # selects among the roots the operator already authorised); it can never widen
  # it.  An empty or non-matching project declaration leaves the operator's list
  # untouched.
  extra_workspace_roots: []
  #   - /home/me/projects/*
  #   - /srv/shared/datasets
  grep:
    enabled: true

# M-D1: the OS-level process sandbox (the *write* boundary).  A bash command or
# a background job under `enforce` cannot create, modify or delete outside the
# workspace and the writable paths below.
#
# M-D2 adds the *read* boundary and the AF_UNIX layer (docs/plan-m-d2.md §B/§D).
# `--ro-bind / /` makes the whole root readable, so `read_deny_paths` is a
# denylist: directories become empty (`--tmpfs`), files become unreadable
# (`--ro-bind /dev/null`).  It is **not** derived from `writable_paths` -- the
# two are independent sides of one wall, and a mask is applied *after* the
# writable binds so deny wins.  The defaults hide `~/.ssh`, `~/.aws`, the
# repository's own credentials (`~/.config/ai-coding`, MCP tokens) and the
# like; the list is expanded through `XDG_CONFIG_HOME` / `XDG_DATA_HOME`, not
# a hardcoded `~/.config`.  It is a denylist, so it is always one rule short:
# that is a deliberate capability boundary, not a guarantee (§7.1).
#
# Cost: masking `~/.ssh` / `~/.gnupg` / `~/.docker/config.json` breaks
# `git push` over SSH, signed commits and `docker push`.  Alternatives: an
# ssh-agent / gpg-agent socket, or a credential helper.  This is a deliberate
# scope cut, not an oversight.
#
# `af_unix_deny_paths` masks pathname sockets (D-Bus, docker.sock).  bwrap has
# no connect/bind filtering, so this is a mask, not a filter -- and it does not
# cover abstract sockets.  `block_af_unix` installs a seccomp filter refusing
# `socket(AF_UNIX)` outright (including abstract); off by default because it
# breaks legitimate IPC (some npm IPC, the docker CLI).
#
# `mode` is `enforce` here, matching the built-in default: when bwrap cannot
# run (bubblewrap not installed, or no unprivileged user namespaces) every
# bash/job is REFUSED with a stable reason code instead of silently running
# unsandboxed.  That is the honest outcome -- never a green lie.
#
# If this host has no unprivileged userns (common on Debian/RHEL), `enforce`
# denies every command; to keep working while reporting the fallback, set
# `mode: warn` (a Degraded event is emitted per call).  `mode: off` disables
# isolation entirely.
#
# `allow_bypass` is roadmap's explicit "do not isolate this run".
# `writable_paths` are extra writable directories beyond the roots (which are
# the workspace plus tools.extra_workspace_roots); the default carries
# ~/.cache and never a credential directory.  Widening this narrows the
# sandbox.
process_sandbox:
  mode: enforce               # off | warn | enforce (the built-in default)
  allow_bypass: false
  writable_paths:
    - ~/.cache
  # The built-in default (when this key is absent) is the standard credential
  # set plus this repository's own keys, expanded through XDG.  Set it to [] to
  # turn the read boundary off -- a warning is logged at load time when you do,
  # because an empty list silently hands the sandbox's read protection away.
  # read_deny_paths: []
  # af_unix_deny_paths: []
  block_af_unix: false
  # M-D2 §C: the network wall.  A write/read wall without a network wall leaks:
  # what the sandbox reads can be sent straight out.
  #
  #   off   = the host network (the pre-M-D2 behaviour)
  #   deny  = --unshare-net, loopback only.  **The default.**
  #   proxy = --unshare-net + one bound Unix socket + an in-sandbox bridge;
  #           the only TCP/UDP way out is the whitelisted HTTP/CONNECT proxy
  #           (AF_UNIX is a parallel channel it does not see -- see
  #           af_unix_deny_paths above).
  #
  # Cost: `deny` breaks `pip install`, `npm install`, `git clone` and
  # `go mod download` -- much bigger than the write boundary's cost.  `proxy`
  # is the exit: list the domains a build needs.  Empty `allow` denies
  # everything, and "*" is rejected at load time (a wildcard is not a wall).
  # A bare domain allows only ports 80/443; use `domain:port` (or
  # `domain:80,443`) to allow another port, e.g. `github.com:22` for SSH.
  # Non-HTTP protocols (databases, raw TCP, UDP) are not proxied.
  #
  # Minimal working proxy example:
  #
  # network:
  #   mode: proxy
  #   proxy_socket: ~/.local/share/ai-coding/sandbox-proxy.sock
  #   allow:
  #     - pypi.org
  #     - files.pythonhosted.org
  #     - github.com
  #     - codeload.github.com
  #   bridge_port: 0            # 0 = the bridge picks a free loopback port
  network:
    mode: deny

mcp:
  # N-4: a *project* layer's mcp/hooks are ignored by default.  A repository
  # cannot grant execution -- `config.example.yaml` ships in the repo, and
  # `mcp.local.yaml` sits next to it.  Put servers you trust in this file
  # (~/.config/ai-coding/config.yaml), or set AI_CODING_TRUST_PROJECT=1 to let a
  # project's own config apply.  Dropped keys are reported as a warning.
  enabled: false                  # master switch; per-server default is ON
  # servers:                     # v2 shape (docs/specs/2026-10-10-external-mcp.md)
  #   - name: fs
  #     command: ["/usr/bin/python3", "-m", "my_mcp_server"]   # argv as one list
  #     environment: {TOKEN: "..."}  # keys are data: case preserved
  #     cwd: /path/to/workspace
  #     disabled: false           # v2 polarity: on unless it says otherwise
  #     timeout:
  #       startup: 60000          # handshake (ms); npx cold start measured ~27s
  #       catalog: 30000          # tools/list (ms)
  #       execution: 600000       # one remote call (ms); omit = turn deadline only
  #     tools: ["read_file"]      # only register these remote tools (R7d)
  #     auto_approve: true        # this server's tools skip the prompt (R7d)
