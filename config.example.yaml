# AI-Coding example configuration.
# Copy to config.local.yaml (git-ignored) and edit.
# Keys follow snake_case; camelCase legacy keys are also accepted at load time.

models:
  deepseek-chat:
    name: deepseek-chat
    base_url: https://api.deepseek.com/v1
    api_key: YOUR_DEEPSEEK_API_KEY_HERE
    streaming: true
    max_tokens: 4096
    temperature: 0.7

default_model: deepseek-chat

ai:
  auto_process_tool_results: true
  max_tool_iterations: 10
  max_concurrent_subagents: 3
  subagent_worktree_isolation: true
  max_context_tokens: 48000
  max_messages: 50
  snip_keep_head: 3
  snip_keep_tail: 20
  keep_recent_tool_results: 3
  per_result_persist_bytes: 30000
  l4_keep_tail: 6
  # R1a orchestration (see docs/r1-analysis.md)
  stop_policy: todo_aware          # natural | todo_aware | strict
  max_todo_nudges: 2
  task_injection: message          # message | system
  max_concurrent_tools: 4
  subagent_timeout_seconds: 600
  # R2: wall-clock ceiling for one user turn (0 disables it).  Iteration counts
  # cannot bound a call that never returns; on expiry the turn ends as TIMEOUT
  # with whatever text was produced.  Includes time spent on approval prompts.
  turn_timeout_seconds: 600
  max_result_data_bytes: 8000
  max_subagent_conclusion_chars: 4000
  stream_usage: true               # set false if your endpoint rejects stream_options

memory:
  enabled: true
  auto_extract: true
  consolidate_threshold: 10
  max_index_entries: 200
  max_per_turn_injections: 5

tools:
  bash:
    enabled: true
    timeout_seconds: 60
  read:
    enabled: true
    max_file_size: 10485760
  write:
    enabled: true
  edit:
    enabled: true
  glob:
    enabled: true

mcp:
  enabled: false
  auto_discover: true
  connection_timeout: 30          # R2: a server that never answers is skipped
  # servers:
  #   - name: fs
  #     command: /usr/bin/python3
  #     args: ["-m", "my_mcp_server"]
  #     enabled: true
  #     env: {TOKEN: "..."}        # merged over a safe default environment
  #     cwd: /path/to/workspace
