# AI-Coding example configuration.
# Copy to config.local.yaml (git-ignored) and edit.
# Keys follow snake_case; camelCase legacy keys are also accepted at load time.

models:
  deepseek-chat:
    name: deepseek-chat
    base_url: https://api.deepseek.com/v1
    api_key: YOUR_DEEPSEEK_API_KEY_HERE
    streaming: true
    max_tokens: 4096
    temperature: 0.7

default_model: deepseek-chat

ai:
  auto_process_tool_results: true
  max_tool_iterations: 10
  max_concurrent_subagents: 3
  subagent_worktree_isolation: true
  max_context_tokens: 48000
  max_messages: 50
  snip_keep_head: 3
  snip_keep_tail: 20
  keep_recent_tool_results: 3
  per_result_persist_bytes: 30000
  l4_keep_tail: 6
  # R1a orchestration (see docs/r1-analysis.md)
  stop_policy: todo_aware          # natural | todo_aware | strict
  max_todo_nudges: 2
  task_injection: message          # message | system
  max_concurrent_tools: 4
  subagent_timeout_seconds: 600
  # R2: wall-clock ceiling for one user turn (0 disables it).  Iteration counts
  # cannot bound a call that never returns; on expiry the turn ends as TIMEOUT
  # with whatever text was produced.  Includes time spent on approval prompts.
  turn_timeout_seconds: 600
  max_result_data_bytes: 8000
  max_subagent_conclusion_chars: 4000
  stream_usage: true               # set false if your endpoint rejects stream_options

memory:
  enabled: true
  auto_extract: true
  consolidate_threshold: 10
  max_index_entries: 200
  max_per_turn_injections: 5
  # R11a — the write-side gate.  The master switch and the per-channel split are
  # two orthogonal things: `extraction_enabled: false` stops every write (recall
  # keeps working, i.e. a read-only memory), while `extraction_extractors` picks
  # which channel runs — "harvest" (turn-end reconciliation) and/or
  # "memory_write" (the model's own tool).  Missing or malformed settings are
  # PERMISSIVE on purpose: a partial yaml must never silently stop writes.
  # extraction_enabled: true
  # extraction_extractors: [harvest, memory_write]   # null = all
  # R11b — wall-clock budget for one recall (filtering + semantic tier + ranking
  # + the miss probe).  Over budget the hits still come back; only the optional
  # `touch` write is skipped and one Degraded(memory_recall) is emitted.  2.0s is
  # far above the measured ~5ms, so it is a placeholder for the day the semantic
  # tier gets slow; 0 disables it.
  # recall_timeout_seconds: 2.0
  # R11d — how the lexical and semantic opinions become one rank term, for the
  # optional embeddings tier only.  blend is the default *and* the measured
  # better one: with `rrf`, reachable R@3 falls 1.00 -> 0.93 (under the 0.95
  # guardrail) to buy +1/46 paraphrase hit.  Re-measure before switching.
  # recall_fusion: blend
  # 可选语义档（R10d）：默认整块关掉。打开需要 provider 指向 models 里的一项，
  # 复用它的 base_url / api_key。deepseek 系端点没有 /embeddings（404），开了
  # 等于没开；min_cosine 是在 text-embedding-v4 上量的，换模型必须重标。
  #embeddings:
  #  enabled: true
  #  provider: "qwen"
  #  model: text-embedding-v4
  #  dimensions: 1024
  #  min_cosine: 0.60
  #  cache_path: .memory/embeddings.json
  #  timeout_seconds: 10

tools:
  bash:
    enabled: true
    timeout_seconds: 60
  read:
    enabled: true
    max_file_size: 10485760
  write:
    enabled: true
  edit:
    enabled: true
  glob:
    enabled: true

mcp:
  enabled: false                  # master switch; per-server default is ON
  # servers:                     # v2 shape (docs/specs/2026-10-10-external-mcp.md)
  #   - name: fs
  #     command: ["/usr/bin/python3", "-m", "my_mcp_server"]   # argv as one list
  #     environment: {TOKEN: "..."}  # keys are data: case preserved
  #     cwd: /path/to/workspace
  #     disabled: false           # v2 polarity: on unless it says otherwise
  #     timeout:
  #       startup: 60000          # handshake (ms); npx cold start measured ~27s
  #       catalog: 30000          # tools/list (ms)
  #       execution: 600000       # one remote call (ms); omit = turn deadline only
  #     tools: ["read_file"]      # only register these remote tools (R7d)
  #     auto_approve: true        # this server's tools skip the prompt (R7d)
