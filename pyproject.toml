[project]
name = "ai-coding"
version = "0.1.0"
description = "an AI coding assistant CLI with a self-owned ReAct loop"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "mcp>=1.19,<3",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "prompt-toolkit>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
ai-coding = "ai_coding.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ai_coding*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4"]

[tool.mypy]
# Checked against the lowest version we support, not the interpreter we run on.
# (This only became possible in R1a-6: openai-agents pulled in numpy, whose PEP
# 695 stubs made mypy abort below 3.12 with "errors prevented further checking".)
python_version = "3.10"
strict = true
check_untyped_defs = true
exclude = ["tests/", ".venv/"]
