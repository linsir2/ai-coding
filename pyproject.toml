[project]
name = "ai-coding"
version = "0.1.0"
description = "an AI coding assistant CLI with a self-owned ReAct loop"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "mcp>=1.24,<2",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    # webfetch's HTTP client (r18/F1).  Chosen over stdlib urllib because it
    # streams (the byte budget is enforced while the body arrives) and follows
    # redirects manually, so the SSRF guard can re-run on every hop -- the
    # stdlib opener followed 302s on its own, which is the defect F1 closed.
    "httpx>=0.27",
    # Gitignore semantics for the workspace walk (r18/F15).  Hand-rolling this
    # is how the fallback and ripgrep came to disagree; pathspec is what git
    # itself uses, and ripgrep already agrees with it.
    "pathspec>=0.12.1",
    # TUI IPC (plan B, M0.5): the Python port of vscode-jsonrpc, maintained by
    # the python-lsp team; the TS side pairs with vscode-jsonrpc itself.
    "python-lsp-jsonrpc>=1.1.2",
    # The shell grammar (W2/T): a command is a shell command, and a regular
    # expression cannot tell "a; b" inside quotes from two commands, nor
    # "cat $(rm -rf /)" from "cat".  Two prebuilt wheels -- no compiler, and
    # one abi3 wheel covers python 3.10 to 3.14.  Pinned because the
    # grammar's ABI moves with its version and the two packages have to
    # agree on it.
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-bash>=0.25,<0.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
ai-coding = "ai_coding.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ai_coding*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# M-G3: two explicit layers.  The unit layer is "everything else", selected by
# exclusion -- marking 272 top-level files would be churn for no signal.
#
# `--strict-markers` makes an undeclared marker a collection error instead of a
# warning: a typo'd marker would otherwise silently select nothing, which is how
# a "layer" becomes a hole.  (`asyncio` is registered by pytest-asyncio, so the
# 1397 existing `@pytest.mark.asyncio` lines are unaffected.)
#
# NO `-m` here on purpose.  addopts is prepended to *every* invocation, so
# `-m 'not live'` would make `pytest tests/test_mcp_stdio.py` collect zero tests
# and exit 5, breaking the documented single-file commands and the live CI step.
# CI selects the layer explicitly instead.
markers = [
    "integration: real I/O inside one process (the tests/integration/ suite)",
    "live: needs an external mechanism (a real MCP server); CI runs it with the gate variable",
]
# -rs: print the reason for every skip.  Without it a gate-gated case (the
# MCP stdio round trips) reads as a bare "6 skipped", which is indistinguishable
# from a real failure the log never mentions.
addopts = "-q -rs --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4"]

[tool.mypy]
# Checked against the lowest version we support, not the interpreter we run on.
# (This only became possible in R1a-6: openai-agents pulled in numpy, whose PEP
# 695 stubs made mypy abort below 3.12 with "errors prevented further checking".)
python_version = "3.10"
strict = true
check_untyped_defs = true
exclude = ["tests/", ".venv/"]
# python-lsp-jsonrpc ships no py.typed marker; the IPC boundary adapts its
# untyped dict messages to our typed handlers (see ai_coding/server/service.py).
[[tool.mypy.overrides]]
module = ["pylsp_jsonrpc.*"]
ignore_missing_imports = true
