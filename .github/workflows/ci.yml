name: CI

# No test file is excluded here.  ``tests/test_tool_bash.py`` and
# ``tests/test_worktree.py`` used to hang in a sandboxed shell; R2b made every
# subprocess bounded (thread + process-group kill), so they run everywhere, and
# ``tests/test_mcp_stdio.py`` — which really spawns an MCP server — runs in the
# step that sets its gate variable.  See docs/r2-analysis.md sections 1 and 9.

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the declared floor (mypy is pinned to it); 3.13 is what the
        # development venv runs.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type-check
        run: mypy ai_coding

      - name: Tests (offline unit + integration, nothing excluded)
        run: python -m pytest -q

      - name: Real MCP stdio round trip
        run: AI_CODING_MCP_STDIO=1 python -m pytest tests/test_mcp_stdio.py -q

      - name: Memory acceptance cases (offline, 11 cases)
        run: python scripts/memory_cases.py

      - name: Observability / guard / hook acceptance cases (offline)
        run: python scripts/trace_cases.py
