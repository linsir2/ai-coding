name: CI

# Five jobs, because the layers answer different questions and a failure in one
# should not hide the others:
#
#   quality      -- lint, types, the golden-corpus benchmarks, the acceptance
#                   scripts, the two gates that used to be local-only, and the
#                   wheel-contents assertion (the frontend must ship inside the
#                   package, H3).
#   unit         -- everything that is neither integration nor live.
#   integration  -- the tests/integration/ suite (real I/O, one process).
#   live         -- the tests that need a real MCP server, gated on
#                   AI_CODING_MCP_STDIO.  It lives in its own job so a live
#                   failure cannot block the layer that runs on every push, and
#                   so the gate variable is set exactly where it is needed.
#   frontend     -- the TypeScript TUI: bun install, typecheck, bun test.  Its
#                   own job because the toolchain is bun, not Python.
#   floor        -- the declared Python 3.10 floor, on the image's own 3.10 (no
#                   downloaded artifact).  See the job's comment for why it is
#                   not a matrix row.
#
# No test file is excluded from the unit layer: R2b made every subprocess
# bounded (thread + process-group kill), so the former hang risks run everywhere.
# See docs/r2-analysis.md sections 1 and 9.
#
# `ubuntu-22.04`, not `ubuntu-latest`, for two measured reasons:
#
#  1. it ships Python 3.10 as the system interpreter, which is what the `floor`
#     job uses -- `setup-python` cannot supply 3.10 without downloading a release
#     asset, and on 2026-11-08 that asset returned 504 three times in a row for
#     every 3.10 job;
#  2. `unit` installs bubblewrap and exercises the real write boundary.  The
#     `ubuntu-24.04` image refuses unprivileged user namespaces, so
#     `BwrapBackend.available()` is False and the mechanism's tests fail -- a
#     green sandbox gate needs a host where the mechanism actually runs.
#
# Bump either pin deliberately, and re-check both facts when you do.

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the declared floor (mypy is pinned to it); 3.13 is what the
        # development venv runs.
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # r18_acceptance compares the rg branch against the fallback.  Without
      # ripgrep it prints a NOTE and returns 0, which is the "both sides ran the
      # fallback" green it warns about.  `git` is used by the same script and
      # ships with the runner.
      - name: Install ripgrep (r18 needs it)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep
          rg --version

      - name: Lint
        run: ruff check .

      # 2026-11: ToolResult.error is now the 16-value gRPC family.  A failed
      # result without a code, an unregistered literal, or a frontend label
      # table that drifted from the registry all turn the build red.
      - name: Tool error-code contract
        run: python scripts/check_error_codes.py

      - name: Type-check
        run: mypy ai_coding

      # M-D2: the red line corpus is a golden snapshot, so this is regression
      # detection rather than a pass/fail checklist -- any verdict that moved
      # (a new false negative inside the corpus, a new false positive) is a
      # red build.  The known_miss / known_fp counts are printed so a later
      # fix is visible as a number dropping to zero.
      - name: Red line benchmark (golden corpus, FN/FP)
        run: python scripts/redline_benchmark.py

      # M-G4: the same discipline one layer up.  The red line benchmark freezes
      # one judge (bash_red_line_with_fallback); this one drives the whole
      # PermissionGate.check() chain -- agent veto, the rule layers, a saved
      # grant, the workspace edge -- over a frozen corpus.
      - name: Permission gate benchmark (golden corpus, FN/FP)
        run: python scripts/permission_benchmark.py

      - name: Memory acceptance cases (offline, 11 cases)
        run: python scripts/memory_cases.py

      - name: Observability / guard / hook acceptance cases (offline)
        run: python scripts/trace_cases.py

      # M-G1: these two were local-only gates -- the retrieval script's own
      # header said "what CI should call" and CI never called it.  Both pass
      # today, so wiring them in is a pure tightening: a regression in the
      # retrieval guardrails or in the rg contract now turns the build red
      # instead of waiting for a human.
      - name: Retrieval guardrails (golden corpus, R@3 / FP@5)
        run: python scripts/retrieval_cases.py --check

      - name: R18 acceptance (rg contract, offline)
        run: python scripts/r18_acceptance.py

      # H3: the TUI ships inside the package.  A wheel that builds but omits
      # ai_coding/frontend is a green build whose `ai-coding` cannot start, so
      # the contents are asserted, not assumed.  `build` is not in the dev
      # extras, hence `pip wheel`.
      - name: Wheel contains the frontend
        run: |
          python -m pip wheel . -w /tmp/wheelhouse --no-deps
          python - <<'PY'
          import glob, sys, zipfile
          wheels = glob.glob("/tmp/wheelhouse/ai_coding-*.whl")
          assert len(wheels) == 1, wheels
          names = set(zipfile.ZipFile(wheels[0]).namelist())
          required = {
              "ai_coding/frontend/src/index.tsx",
              "ai_coding/frontend/src/component/dialog-models.tsx",
              # One `.ts` too: the `.tsx` and `.ts` globs are separate entries,
              # and losing the latter breaks every import.
              "ai_coding/frontend/src/util/connect.ts",
              "ai_coding/frontend/bun.lock",
              "ai_coding/frontend/package.json",
              "ai_coding/frontend/bunfig.toml",
              "ai_coding/frontend/tsconfig.json",
          }
          missing = required - names
          sys.exit(f"wheel missing: {sorted(missing)}" if missing else 0)
          PY

  unit:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # ripgrep is what GrepTool's rg branch shells out to, and seven tests
      # exercise that branch -- three hard-fail without it, two skip themselves,
      # and two would otherwise compare the fallback against itself.
      - name: Install ripgrep (the rg branch is part of the contract)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep
          rg --version

      # M-D1: the OS-level process sandbox's real-subprocess cases exercise
      # bubblewrap itself.  Without the package they skip with their stated
      # reason -- honest, but it means CI never verifies the write boundary.
      - name: Install bubblewrap (the process sandbox's mechanism)
        run: |
          sudo apt-get install -y -qq bubblewrap
          bwrap --version

      - name: Unit tests (neither integration nor live)
        run: python -m pytest -q -m "not integration and not live"

  integration:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # test_r17_parity compares the rg branch against the fallback; the other
      # two files shell out to git, which the runner ships.
      - name: Install ripgrep (the rg branch is part of the contract)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep
          rg --version

      - name: Integration tests
        run: python -m pytest -q -m integration

  live:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # The gate variable is set here and nowhere else.  tests/test_live_gate.py
      # fails if it is missing, so a job that silently skips the whole layer is
      # a red build rather than a green one covering nothing.
      - name: Live tests (real MCP server)
        run: AI_CODING_MCP_STDIO=1 python -m pytest -q -m live

  # The declared floor (`requires-python >= 3.10`, and mypy's `python_version`)
  # needs a runtime job, but `setup-python` cannot supply one without a network
  # download: the floating `3.10` resolves to the newest patch, and on
  # 2026-11-08 that release asset returned 504 three times in a row -- for every
  # 3.10 job, on both ubuntu-24.04 and ubuntu-22.04, while every 3.13 job (whose
  # interpreter is already in the image) stayed green.
  #
  # Ubuntu 22.04 ships 3.10.12 as its system Python, so the floor is exercised
  # from the image itself: no artifact, no CDN, nothing to retry.  One job is
  # enough -- the other four layers run on 3.13, and the floor's question is
  # "does the code import and pass at 3.10", which the unit suite answers.
  floor:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Use the image's Python 3.10 (no download)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3.10-venv
          python3.10 --version
          python3.10 -m venv "$RUNNER_TEMP/py310"
          echo "$RUNNER_TEMP/py310/bin" >> "$GITHUB_PATH"

      - name: Install
        run: |
          python --version
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Same two mechanisms the unit layer needs: ripgrep for the rg branch,
      # bubblewrap so the write boundary is exercised rather than skipped.
      - name: Install ripgrep and bubblewrap
        run: |
          sudo apt-get install -y -qq ripgrep bubblewrap
          rg --version
          bwrap --version

      - name: Unit tests on the floor
        run: python -m pytest -q -m "not integration and not live"

  # The TUI is TypeScript on bun; nothing in the Python jobs compiles it.  The
  # bun version is pinned to the one that generated bun.lock, because
  # --frozen-lockfile fails on a lockfile written by a different resolver.
  frontend:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.14"

      - name: Install
        working-directory: ai_coding/frontend
        run: bun install --frozen-lockfile

      - name: Type-check
        working-directory: ai_coding/frontend
        run: bun run typecheck

      - name: Frontend tests
        working-directory: ai_coding/frontend
        run: bun test
