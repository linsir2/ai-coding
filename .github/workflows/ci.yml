name: CI

# No test file is excluded here.  ``tests/test_tool_bash.py`` and
# ``tests/test_worktree.py`` used to hang in a sandboxed shell; R2b made every
# subprocess bounded (thread + process-group kill), so they run everywhere, and
# ``tests/test_mcp_stdio.py`` — which really spawns an MCP server — runs in the
# step that sets its gate variable.  See docs/r2-analysis.md sections 1 and 9.

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the declared floor (mypy is pinned to it); 3.13 is what the
        # development venv runs.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # ripgrep is what GrepTool's rg branch shells out to, and seven tests exercise
      # that branch -- three hard-fail without it, two skip themselves, and two would
      # otherwise compare the fallback against itself.  ubuntu-24.04 ships without it,
      # so without this step CI never verifies the rg branch at all, which is exactly
      # how r19/F1 leaked absolute paths (docs/data-contracts.md, r20/F0).
      - name: Install ripgrep (the rg branch is part of the contract)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep
          rg --version

      - name: Lint
        run: ruff check .

      - name: Type-check
        run: mypy ai_coding

      - name: Tests (offline unit + integration, nothing excluded)
        run: python -m pytest -q

      # M-D2: the red line corpus is a golden snapshot, so this is regression
      # detection rather than a pass/fail checklist -- any verdict that moved
      # (a new false negative inside the corpus, a new false positive) is a
      # red build.  The known_miss / known_fp counts are printed so a later
      # fix is visible as a number dropping to zero.
      - name: Red line benchmark (golden corpus, FN/FP)
        run: python scripts/redline_benchmark.py

      - name: Real MCP stdio round trip
        run: AI_CODING_MCP_STDIO=1 python -m pytest tests/test_mcp_stdio.py -q

      # The class the model actually calls, end to end: engine -> mcp_call ->
      # real subprocess -> write_back. Without this, mcp_call has never been
      # executed against a real server by anything (M5 follow-up).
      - name: Real MCP call, whole path
        run: AI_CODING_MCP_STDIO=1 python -m pytest tests/test_mcp_end_to_end.py -q

      - name: Memory acceptance cases (offline, 11 cases)
        run: python scripts/memory_cases.py

      - name: Observability / guard / hook acceptance cases (offline)
        run: python scripts/trace_cases.py
